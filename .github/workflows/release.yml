# Builds MynahSetup.exe on every version tag and attaches it to the
# GitHub release (creating a draft release if none exists yet).
#
# The installer is a ~15 MB stdlib-only PyInstaller onefile — no torch,
# no CUDA — so this runs comfortably on a stock windows-latest runner.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # upload release assets

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install "pyinstaller>=6.3"

      - name: Build MynahSetup.exe
        run: python installer/build_installer.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MynahSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MynahSetup.exe" | Out-File -Encoding ascii dist/MynahSetup.exe.sha256
          Get-Content dist/MynahSetup.exe.sha256

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Attach to the existing release for this tag, or create a
          # draft one if the release hasn't been written yet.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Draft — release notes pending."
          }
          gh release upload $tag dist/MynahSetup.exe dist/MynahSetup.exe.sha256 --clobber
